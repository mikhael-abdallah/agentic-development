# golangci-lint v2 — clean-code gates for the Go engine (ROADMAP phase 2).
#
# Limits are tuned for Go, where explicit `if err != nil` handling adds
# vertical space that says nothing about complexity: funlen 80 / file length
# 600 keep functions and files honest, while cyclop / gocognit / nestif are
# the real complexity gates. Ratchet, don't relax: these only tighten.
version: "2"

linters:
  default: standard
  enable:
    - bidichk      # no bidirectional-override characters in Go source
    - bodyclose    # HTTP response bodies are closed
    - cyclop       # cyclomatic complexity
    - depguard     # architecture boundaries
    - errchkjson   # JSON encode errors are handled
    - errorlint    # errors.Is/As over == and type asserts
    - exhaustive   # switch covers every enum value
    - funlen       # function length
    - gocognit     # cognitive complexity
    - gosec        # security anti-patterns
    - makezero     # append after make([]T, n) overwrites nothing
    - forbidigo    # banned calls (a skipped test — see settings)
    - nestif       # nesting depth
    - nilerr       # returning nil when err is non-nil
    - nolintlint   # every nolint needs a justification
    - prealloc     # pre-allocate slices when the size is known
    - revive
    - testifylint  # correct testify assertions (dormant until testify is used)
    - thelper      # test helpers call t.Helper()
    - tparallel    # t.Parallel() used consistently
    - unparam      # unused function parameters
    - usetesting   # t.TempDir/t.Setenv over the os equivalents

  settings:
    cyclop:
      max-complexity: 12
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 4
    # Architecture boundaries from ARCHITECTURE.md, enforced per directory.
    # Dependencies point one way: cmd -> api -> sim -> model.
    depguard:
      rules:
        # model is the bottom of the stack: it imports nothing else here.
        engine-model-imports-nothing:
          list-mode: lax
          files:
            - "**/engine/internal/model/**"
          deny:
            - pkg: github.com/mikhael-abdallah/agentic-development/engine/internal/sim
              desc: model is the bottom layer; sim depends on model, never the reverse
            - pkg: github.com/mikhael-abdallah/agentic-development/engine/internal/api
              desc: model must not know about transport
        # sim sits above model and below every adapter.
        engine-sim-imports-only-model:
          list-mode: lax
          files:
            - "**/engine/internal/sim/**"
          deny:
            - pkg: github.com/mikhael-abdallah/agentic-development/engine/internal/api
              desc: the simulation core must not depend on its HTTP adapter
        # The core is pure: deterministic, no I/O, no transport, no wall clock.
        # Adapters (api, cmd) do the talking; anything here stays testable.
        engine-core-is-pure:
          list-mode: lax
          files:
            - "**/engine/internal/model/**"
            - "**/engine/internal/sim/**"
          deny:
            - pkg: net/http
              desc: the core must not know about HTTP; keep it in the api layer
            - pkg: os
              desc: the core must not touch the filesystem, env, or process state
            - pkg: database/sql
              desc: the core must not talk to a database
            - pkg: syscall
              desc: the core must not make syscalls
        # Nothing may import a main package's directory.
        engine-nobody-imports-cmd:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/mikhael-abdallah/agentic-development/engine/cmd
              desc: cmd holds binaries; extract shared code into internal instead
    forbidigo:
      forbid:
        # A skipped test still reports as passing, which makes skipping the
        # cheapest way to turn a red gate green. Deleting the test at least
        # shows up in the coverage gate.
        - pattern: ^t\.Skip(Now|f)?$
          msg: a skipped test passes without testing anything; fix or delete it
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      # The default set is a subset. All of it, minus the doc-comment style
      # rules, which say nothing about correctness.
      checks: ["all", "-ST1000", "-ST1020", "-ST1021", "-ST1022"]
    revive:
      rules:
        - name: argument-limit
          arguments: [4]
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true

  exclusions:
    rules:
      # Test files: table-driven tests legitimately run long and repetitive.
      - path: _test\.go
        linters: [funlen, gocognit, cyclop, nestif]

formatters:
  enable:
    - gofumpt
    - gci # deterministic import order: stdlib, third-party, this module
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
