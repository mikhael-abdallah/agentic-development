name: guardrails

# Each job is a thin wrapper around the same scripts/guards/*.sh scripts the
# pre-push hook runs locally — one source of truth for every guard.

on:
  pull_request:
    # 'edited' matters: the PR title becomes the squash commit message, and
    # without it a title could be fixed up only until pr-title passed, then
    # renamed. parity-check enforces that this stays here.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-check:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every CI guard has a local counterpart
        run: scripts/guards/parity-check.sh

  structure-check:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository layout matches ARCHITECTURE.md
        run: scripts/guards/structure-check.sh

  unicode-check:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject invisible and direction-changing Unicode
        run: scripts/guards/unicode-check.sh

  ratchet-check:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Quality settings only tighten
        run: scripts/guards/ratchet-check.sh

  hygiene-check:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every tracked file is reviewable
        run: scripts/guards/hygiene-check.sh

  secret-scan:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full git history with gitleaks
        run: scripts/guards/secret-scan.sh

  workflow-lint:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows with actionlint
        run: scripts/guards/workflow-lint.sh

  workflow-security:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/guards/workflow-security.sh

  shell-lint:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts with shellcheck and run gate tests
        run: scripts/guards/shell-lint.sh

  dup-check:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Detect copy-paste duplication with jscpd
        run: scripts/guards/dup-check.sh

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/guards/pr-title.sh "$PR_TITLE"

  pr-guard:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce PR size limits
        run: scripts/guards/pr-guard.sh

  dep-scan:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan both lockfiles with osv-scanner
        run: scripts/guards/dep-scan.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  web-lint:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # guard_applies needs the base branch to decide whether this gate
          # has anything to do; a shallow clone has no origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Web static gates (tsc, eslint, knip)
        run: scripts/guards/web-lint.sh

  web-test:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Web tests and patch-coverage gate
        run: scripts/guards/web-test.sh

  web-build:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # guard_applies needs the base branch to decide whether this gate
          # has anything to do; a shallow clone has no origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Next build and first-load bundle budget
        run: scripts/guards/web-build.sh

  go-lint:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # guard_applies needs the base branch to decide whether this gate
          # has anything to do; a shallow clone has no origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Lint the Go engine with golangci-lint
        run: scripts/guards/go-lint.sh

  go-test:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Go tests (race + shuffle) and patch-coverage gate
        run: scripts/guards/go-test.sh

  go-vuln:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # guard_applies needs the base branch to decide whether this gate
          # has anything to do; a shallow clone has no origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Go dependencies with govulncheck
        run: scripts/guards/go-vuln.sh
