name: guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full git history with gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          TOOL="$RUNNER_TOOL_CACHE/gitleaks/$GITLEAKS_VERSION"
          if [ ! -x "$TOOL/gitleaks" ]; then
            mkdir -p "$TOOL"
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar -xz -C "$TOOL" gitleaks
          fi
          "$TOOL/gitleaks" git --no-banner --redact .

  workflow-lint:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          TOOL="$RUNNER_TOOL_CACHE/actionlint/$ACTIONLINT_VERSION"
          if [ ! -x "$TOOL/actionlint" ]; then
            mkdir -p "$TOOL"
            curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
              | tar -xz -C "$TOOL" actionlint
          fi
          "$TOOL/actionlint" -color

  workflow-security:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        env:
          ZIZMOR_VERSION: 1.28.0
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOOL="$RUNNER_TOOL_CACHE/zizmor/$ZIZMOR_VERSION"
          if [ -z "$(find "$TOOL" -name zizmor -type f 2>/dev/null)" ]; then
            mkdir -p "$TOOL"
            curl -sSfL "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
              | tar -xz -C "$TOOL"
          fi
          BIN=$(find "$TOOL" -name zizmor -type f | head -1)
          "$BIN" --min-severity medium .github/workflows/

  shell-lint:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts with shellcheck and run gate tests
        env:
          SHELLCHECK_VERSION: 0.11.0
        run: |
          TOOL="$RUNNER_TOOL_CACHE/shellcheck/$SHELLCHECK_VERSION"
          if [ ! -x "$TOOL/shellcheck" ]; then
            mkdir -p "$TOOL"
            curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
              | tar -xJ -C "$TOOL" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          fi
          "$TOOL/shellcheck" scripts/*.sh scripts/tests/*.sh .githooks/*
          scripts/tests/ai-review-test.sh

  dup-check:
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Detect copy-paste duplication with jscpd
        run: npx --yes jscpd@5.0.14 --threshold 2 --min-tokens 50 --ignore "**/.git/**" .

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 5
    steps:
      - name: Enforce Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title: $PR_TITLE"
          if ! printf '%s' "$PR_TITLE" | grep -qE '^(feat|fix|docs|refactor|test|perf|ci|chore|build)(\([a-z0-9./-]+\))?!?: .{1,72}$'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(engine): add latency model'. Squash merges turn it into the commit message."
            exit 1
          fi

  pr-guard:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 10
    env:
      MAX_CHANGED_LINES: 1000
      MAX_CHANGED_FILES: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce PR size limits
        run: |
          BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          FILES=$(git diff --name-only "$BASE" HEAD | wc -l)
          LINES=$(git diff --numstat "$BASE" HEAD | awk '{ added += $1; deleted += $2 } END { print added + deleted }')
          echo "Changed files: $FILES (max $MAX_CHANGED_FILES)"
          echo "Changed lines: $LINES (max $MAX_CHANGED_LINES)"
          if [ "$FILES" -gt "$MAX_CHANGED_FILES" ] || [ "$LINES" -gt "$MAX_CHANGED_LINES" ]; then
            echo "::error::PR too large. Split it into smaller increments."
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, agentic]
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
