version: 2

# Cooldown delays version bumps past the window in which a malicious release
# is typically discovered and yanked — the cheapest defence there is against
# a compromised maintainer account, which no advisory database can warn about
# in advance because there is no advisory yet.
#
# Security updates are exempt from cooldown by design: a known-exploited
# vulnerability should not wait. npm gets the longest window because it has
# both the largest transitive surface and the shortest attack half-life.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  # The Dockerfile pins its base images by digest, which is what makes a
  # rebuild reproducible — and also what stops it from ever picking up a
  # patched base on its own. Without this entry those digests would silently
  # become the oldest dependency in the repository.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
    # The two builder stages are not dependabot's to move. Their versions are
    # owned by scripts/guards/go-env.sh and web-env.sh, which are what the
    # gates actually run — bumping one here alone produces an image built with
    # a toolchain nothing has checked. PR #73 was exactly that: node
    # 24.18.1 -> 26.5.0 in the Dockerfile and nowhere else.
    #
    # Their digests going stale costs nothing, because neither image ships:
    # they compile, and the artifact is a static binary plus a directory of
    # assets copied into distroless. That runtime image is the only base with
    # anything of its own in the layer someone can reach, and it is the one
    # this entry still watches.
    #
    # A toolchain bump is a change to those two scripts, made deliberately,
    # with the Dockerfile following in the same pull request.
    ignore:
      - dependency-name: golang
      - dependency-name: node
  - package-ecosystem: gomod
    directory: /engine
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns:
          - "*"
    # A grouped update is all-or-nothing: one member that cannot install takes
    # every other member down with it. eslint 10 is that member — the plugins
    # this config depends on still declare `eslint: ^9` as their peer range, so
    # `npm ci` fails to resolve and web-lint, web-test and web-build all fail.
    # Left alone it is re-proposed weekly, fails weekly, and blocks unrelated
    # bumps (typescript, in PR #37) behind a dependency we cannot act on.
    #
    # Only the major is ignored, so eslint 9.x patches — including security
    # releases, which cooldown already exempts — still arrive. Remove this
    # entry once the plugins accept eslint 10; the check is one command:
    #   npm view eslint-plugin-jsx-a11y peerDependencies.eslint
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # Same shape, different plugin: typescript-eslint declares
      # `typescript: ">=4.8.4 <6.1.0"`, so typescript 7 cannot install and PR
      # #39 failed npm ci for it, taking the rest of the group with it.
      #
      # A version range rather than semver-major, and the difference matters:
      # that peer range *allows* typescript 6.0, which is already published as
      # a beta. Ignoring the major would have blocked a version that works, and
      # done it silently — the same shape of mistake as the block this entry
      # exists to remove.
      #
      # Forcing 7 in is not an option worth having. It needs either
      # --legacy-peer-deps, which switches off peer resolution for every
      # dependency permanently, or dropping typescript-eslint, which is the
      # whole type-aware lint layer. Both trade a real gate for a compiler
      # version. Revisit when the peer range moves:
      #   npm view typescript-eslint peerDependencies.typescript
      - dependency-name: typescript
        versions:
          - ">= 7"
