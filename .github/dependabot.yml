version: 2

# Cooldown delays version bumps past the window in which a malicious release
# is typically discovered and yanked — the cheapest defence there is against
# a compromised maintainer account, which no advisory database can warn about
# in advance because there is no advisory yet.
#
# Security updates are exempt from cooldown by design: a known-exploited
# vulnerability should not wait. npm gets the longest window because it has
# both the largest transitive surface and the shortest attack half-life.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /engine
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns:
          - "*"
    # A grouped update is all-or-nothing: one member that cannot install takes
    # every other member down with it. eslint 10 is that member — the plugins
    # this config depends on still declare `eslint: ^9` as their peer range, so
    # `npm ci` fails to resolve and web-lint, web-test and web-build all fail.
    # Left alone it is re-proposed weekly, fails weekly, and blocks unrelated
    # bumps (typescript, in PR #37) behind a dependency we cannot act on.
    #
    # Only the major is ignored, so eslint 9.x patches — including security
    # releases, which cooldown already exempts — still arrive. Remove this
    # entry once the plugins accept eslint 10; the check is one command:
    #   npm view eslint-plugin-jsx-a11y peerDependencies.eslint
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
